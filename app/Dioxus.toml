[application]
name = "Wispr Lightning"

[bundle]
identifier = "com.wisprlightning.app"
publisher = "Wispr Lightning"
icon = ["icons/32x32.png", "icons/128x128.png", "icons/128x128@2x.png", "icons/icon.icns", "icons/icon.ico"]
short_description = "Fast push-to-talk dictation"
long_description = "A fast, native push-to-talk dictation app. Hold a hotkey, speak, and the transcribed text is inserted wherever your cursor is."
copyright = "Copyright (c) 2026"
category = "Productivity"

[bundle.macos]
minimum_system_version = "13.0"
entitlements = "entitlements.plist"
info_plist_path = "Info.plist"
hardened_runtime = true

# Sounds ship as a dx folder asset (see `app/src/paths.rs`), not through
# `resources`: dx copies config resources by bare file name, and the packs
# share file names.

# dx's bundler reads `bundle.windows`; a top-level `[windows]` table is ignored.
[bundle.windows]
# dx defaults to embedding the ~180 MB offline WebView2 installer. Windows 11
# and current Windows 10 already ship WebView2; the ~2 MB bootstrapper installs
# it silently only where it is missing.
webview_install_mode = { EmbedBootstrapper = { silent = true } }

[bundle.windows.nsis]
install_mode = "CurrentUser"
