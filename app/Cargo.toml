[package]
name = "wispr-lightning"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "wispr-lightning"
path = "src/main.rs"


[dependencies]
dioxus = { version = "0.7", features = ["desktop"] }
wl-core = { workspace = true }
wl-platform = { workspace = true }
wl-providers = { workspace = true }
wl-shell = { workspace = true }
tokio = { workspace = true }
parking_lot = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
arboard = "3"
single-instance = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
dirs = "6"
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", rev = "9a758255ea26e2b20c8cecf4c1c946feb9e71da7" }
dioxus-icons = { version = "0.1.0", default-features = false }
rfd = "0.17"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true }
objc2-foundation = { workspace = true }
objc2-app-kit = { workspace = true }

[dev-dependencies]
tempfile = "3"

